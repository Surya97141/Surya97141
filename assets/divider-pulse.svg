<svg width="900" height="28" viewBox="0 0 900 28" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF00E5"/>
      <stop offset="0.5" stop-color="#8B00FF"/>
      <stop offset="1" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="dglow" x="-40%" y="-200%" width="180%" height="500%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- baseline -->
  <line x1="0" y1="14" x2="900" y2="14" stroke="url(#dgrad)" stroke-width="1" opacity="0.35"/>
  <!-- heartbeat trace: flat, spike cluster, flat — drawn once, swept across -->
  <g filter="url(#dglow)">
    <path d="M -180 14 H -120 L -112 14 L -106 4 L -100 24 L -94 8 L -88 14 H -60 L -54 11 L -48 17 L -42 14 H 0"
          fill="none" stroke="url(#dgrad)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1080 0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- node ticks along the line -->
  <g fill="#00F0FF">
    <circle cx="150" cy="14" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="14" r="2" fill="#8B00FF"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="14" r="2" fill="#FF2E9F"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
