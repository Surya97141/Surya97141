<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mission log timeline">
  <defs>
    <filter id="tglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="260" rx="10" fill="#07070f"/>
  <text x="30" y="34" font-family="'Courier New',monospace" font-size="12" fill="#00F0FF" letter-spacing="4">MISSION.LOG</text>
  <line x1="30" y1="44" x2="870" y2="44" stroke="#1c1c30" stroke-width="1"/>

  <!-- vertical spine -->
  <line x1="52" y1="60" x2="52" y2="240" stroke="#2a2a44" stroke-width="1.6"/>

  <!-- rows boot in sequentially: opacity staggers on load, then stays.
       Each row: LED + year + label + status tag -->
  <g font-family="'Courier New',monospace" font-size="11.5">

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.2s" fill="freeze"/>
      <circle cx="52" cy="70" r="4.5" fill="#FF2E9F" filter="url(#tglow)">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="76" y="74" fill="#8B00FF">2025</text>
      <text x="126" y="74" fill="#f2f4ff">MAIRA — ML research reproducibility auditing agent</text>
      <text x="870" y="74" text-anchor="end" fill="#FF2E9F">[ACTIVE]</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.5s" fill="freeze"/>
      <circle cx="52" cy="98" r="4.5" fill="#FF2E9F" filter="url(#tglow)">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.4s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
      <text x="76" y="102" fill="#8B00FF">2025</text>
      <text x="126" y="102" fill="#f2f4ff">DRL Aerial Combat — multi-agent PPO, custom Gym env</text>
      <text x="870" y="102" text-anchor="end" fill="#FF2E9F">[ACTIVE]</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.8s" fill="freeze"/>
      <circle cx="52" cy="126" r="4.5" fill="#00F0FF"/>
      <text x="76" y="130" fill="#8B00FF">2025</text>
      <text x="126" y="130" fill="#c9d1d9">SentinelAI — Galgotias Creator Hackathon</text>
      <text x="870" y="130" text-anchor="end" fill="#00F0FF">[SHIPPED]</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.1s" fill="freeze"/>
      <circle cx="52" cy="154" r="4.5" fill="#00F0FF"/>
      <text x="76" y="158" fill="#8B00FF">2024</text>
      <text x="126" y="158" fill="#c9d1d9">Flood Prediction — Smart India Hackathon</text>
      <text x="870" y="158" text-anchor="end" fill="#00F0FF">[SHIPPED]</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.4s" fill="freeze"/>
      <circle cx="52" cy="182" r="4.5" fill="#8B00FF"/>
      <text x="76" y="186" fill="#8B00FF">2024</text>
      <text x="126" y="186" fill="#c9d1d9">Kaggle Intro to ML · IIT Hyderabad Neural Intelligence</text>
      <text x="870" y="186" text-anchor="end" fill="#8B00FF">[CERTIFIED]</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.7s" fill="freeze"/>
      <circle cx="52" cy="210" r="4.5" fill="#f2f4ff"/>
      <text x="76" y="214" fill="#8B00FF">2024</text>
      <text x="126" y="214" fill="#c9d1d9">B.Tech CSE (Data Science) @ AKTU — 2024–2028</text>
      <text x="870" y="214" text-anchor="end" fill="#f2f4ff">[BOOT]</text>
    </g>
  </g>

  <!-- cursor line at bottom -->
  <g font-family="'Courier New',monospace" font-size="11" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.1s" fill="freeze"/>
    <text x="40" y="242" fill="#00F0FF">&gt; next_entry: loading…</text>
    <rect x="205" y="232" width="7" height="12" fill="#FF2E9F">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
